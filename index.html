<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>せかいを しる</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ffb84d"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;background:#fff4d6}
#boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#6b5671}#boot img{width:120px;height:120px}#boot button{font:800 30px 'M PLUS Rounded 1c',sans-serif;padding:16px 46px;border:0;border-radius:999px;background:#ff9a3c;color:#fff;box-shadow:0 6px 0 #d97a22}
#boot small{font-size:12px;color:#a898a8}</style></head><body>
<div id="boot"><img src="ill/earth.webp" alt=""><button id="go">はじめる</button><small>こえ：VOICEVOX:ずんだもん</small></div>
<script type="module">
import { openSekai } from './sekai.js';
const go = () => { document.getElementById('boot').style.display = 'none'; openSekai({ api: '1.1', gameId: 'sekai', onClose: () => { document.getElementById('boot').style.display = ''; } }); };
document.getElementById('go').onclick = go;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
