.istamp .ist i:nth-child(2){animation-delay:.1s}.istamp .ist i:nth-child(3){animation-delay:.2s}.istamp .ist i:nth-child(4){animation-delay:.3s}.istamp .ist i:nth-child(5){animation-delay:.4s}.istamp .ist i:nth-child(6){animation-delay:.5s}.istamp .ist i:nth-child(7){animation-delay:.6s}
.istamp p{font-size:18px;color:#6a4a3a}
#tut .tdots i{font-style:normal;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;background:#fff;border:2px dashed #e8c9a0;margin-right:3px}
#tut .tdots i.on{border:2px solid #ff8a5c;transform:scale(1.15)}#tut .tdots i.done{background:#ffe1e8;border:2px solid #ff7aa0;transform:rotate(-12deg)}
.tstamps{display:flex;justify-content:center;gap:4px;font-size:30px;margin:4px 0}
.editor.painting .pv3d{cursor:crosshair;outline:4px dashed #ffb24a;outline-offset:-4px;border-radius:18px}
#title .credit{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:rgba(90,60,40,.7)}
img.fic{width:1.5em;height:1.5em;display:inline-block;vertical-align:middle;object-fit:contain}
.spic img{width:46px;height:46px;border-radius:50%;display:block}
svg.emi{width:1.2em;height:1.2em;vertical-align:-.24em;display:inline-block;flex:none;filter:drop-shadow(0 1px 0 rgba(255,255,255,.7))}
</style>
